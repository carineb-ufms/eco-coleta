services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
    command: >
      bash -lc "python banco-de-dados/executar.py &&
      if ! pgrep -f 'http.server 8000' >/dev/null; then
      nohup python -m http.server 8000 --directory /workspace >/tmp/ecocoleta_http.log 2>&1 &
      fi &&
      sleep infinity"
    ports:
      - "8000:8000"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    working_dir: /app
    volumes:
      - .:/app:cached
    command: uvicorn api.app:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    environment:
      PYTHONPATH: /app
